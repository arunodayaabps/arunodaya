<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Dashboard | Arunodaya Science</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

:root{
  --green:#126b45;
  --deep:#073b29;
  --mint:#dff7eb;
  --ink:#12251b;
  --muted:#66776d;
  --line:#dcebe2;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'DM Sans',Arial,sans-serif;
  color:var(--ink);
  background:#f5faf7;
}

.header{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:18px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-family:'Plus Jakarta Sans';
  font-weight:800;
  color:var(--deep);
  font-size:20px;
}

.logout{
  border:0;
  background:#ffecec;
  color:#a51d1d;
  padding:10px 15px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.wrap{
  max-width:1150px;
  margin:auto;
  padding:30px 18px 70px;
}

h1{
  font-family:'Plus Jakarta Sans';
  margin:0;
  font-size:34px;
}

.subtitle{
  color:var(--muted);
  margin:8px 0 30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:20px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
}

.card-number{
  font-size:34px;
  font-weight:800;
  color:var(--green);
}

.card-title{
  color:var(--muted);
  margin-top:5px;
}

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:25px;
  margin-top:20px;
}

.panel h2{
  font-family:'Plus Jakarta Sans';
  margin-top:0;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  text-align:left;
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

th{
  color:var(--green);
}

.empty{
  color:var(--muted);
}

.notice{
  background:#fff8dc;
  border-left:4px solid #ffd66b;
  padding:13px 15px;
  border-radius:10px;
  color:#5e4d18;
  margin-bottom:20px;
}

@media(max-width:800px){
  .cards{
    grid-template-columns:1fr;
  }

  .panel{
    overflow-x:auto;
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    🧪 Arunodaya Science — Admin Dashboard
  </div>

  <button class="logout" id="logoutBtn">
    Logout
  </button>

</header>

<main class="wrap">

  <h1>Admin Dashboard</h1>

  <p class="subtitle">
    Monitor the Arunodaya Science learning portal.
  </p>

  <div class="notice">
    🔐 You are viewing the administrator area.
  </div>

  <section class="cards">

    <div class="card">
      <div class="card-number" id="studentCount">—</div>
      <div class="card-title">Student Activities</div>
    </div>

    <div class="card">
      <div class="card-number" id="materialCount">—</div>
      <div class="card-title">Study Materials</div>
    </div>

    <div class="card">
      <div class="card-number" id="userEmail">—</div>
      <div class="card-title">Logged-in Admin</div>
    </div>

  </section>


  <section class="panel">

    <h2>👨‍🎓 Recent Student Activity</h2>

    <div id="activity">
      <p class="empty">Loading...</p>
    </div>

  </section>


  <section class="panel">

    <h2>📚 Study Materials</h2>

    <div id="materials">
      <p class="empty">Loading...</p>
    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ttuhcdgclnsxhoypfwhk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_u_U8gTism0c2pgGLlh-FIw_m4re6VSG";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// Check Admin Login

async function checkAdmin(){

  const { data, error } =
    await supabase.auth.getUser();

  if(error || !data.user){

    window.location.href = "login.html";
    return null;

  }

  const { data: profile, error: profileError } =
    await supabase
      .from("profiles")
      .select("role")
      .eq("id", data.user.id)
      .single();

  if(
    profileError ||
    !profile ||
    profile.role !== "admin"
  ){

    await supabase.auth.signOut();

    alert("Admin access required.");

    window.location.href = "login.html";

    return null;

  }

  document.getElementById("userEmail").textContent =
    data.user.email;

  return data.user;

}


// Load student activity

async function loadActivity(){

  const { data, error } =
    await supabase
      .from("student_activity")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(50);

  if(error){

    document.getElementById("activity").innerHTML =
      '<p class="empty">Unable to load student activity.</p>';

    return;

  }

  document.getElementById("studentCount").textContent =
    data ? data.length : 0;

  if(!data || data.length === 0){

    document.getElementById("activity").innerHTML =
      '<p class="empty">No student activity yet.</p>';

    return;

  }

  document.getElementById("activity").innerHTML = `

    <table>

      <thead>

        <tr>
          <th>Student</th>
          <th>Email</th>
          <th>Activity</th>
          <th>Date</th>
        </tr>

      </thead>

      <tbody>

        ${data.map(function(item){

          return `

            <tr>

              <td>${item.student_name || "—"}</td>

              <td>${item.email || "—"}</td>

              <td>${item.activity || item.action || "—"}</td>

              <td>${item.created_at
                ? new Date(item.created_at).toLocaleString()
                : "—"}</td>

            </tr>

          `;

        }).join("")}

      </tbody>

    </table>

  `;

}


// Load study materials

async function loadMaterials(){

  const { data, error } =
    await supabase
      .from("study_material")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(100);

  if(error){

    document.getElementById("materials").innerHTML =
      '<p class="empty">Unable to load study materials.</p>';

    return;

  }

  document.getElementById("materialCount").textContent =
    data ? data.length : 0;

  if(!data || data.length === 0){

    document.getElementById("materials").innerHTML =
      '<p class="empty">No study materials yet.</p>';

    return;

  }

  document.getElementById("materials").innerHTML = `

    <table>

      <thead>

        <tr>
          <th>Class</th>
          <th>Chapter</th>
          <th>Title</th>
        </tr>

      </thead>

      <tbody>

        ${data.map(function(item){

          return `

            <tr>

              <td>${item.class || "—"}</td>

              <td>${item.chapter || "—"}</td>

              <td>${item.title || "—"}</td>

            </tr>

          `;

        }).join("")}

      </tbody>

    </table>

  `;

}


// Logout

document
.getElementById("logoutBtn")
.addEventListener("click", async function(){

  await supabase.auth.signOut();

  window.location.href = "login.html";

});


// Start

checkAdmin().then(function(user){

  if(user){

    loadActivity();
    loadMaterials();

  }

});

</script>

</body>
</html>
