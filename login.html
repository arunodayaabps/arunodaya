<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher / Admin Login | Arunodaya Science</title>

<style>
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#e8fff2,#e7f4ff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:25px;
  padding:35px;
  box-shadow:0 20px 60px #0002;
}

h1{
  text-align:center;
}

.subtitle{
  text-align:center;
  color:#66776d;
}

label{
  display:block;
  font-weight:bold;
  margin:18px 0 7px;
}

input{
  width:100%;
  padding:13px;
  box-sizing:border-box;
  border:1px solid #cbdacf;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:25px;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#126b45;
  color:white;
  font-size:16px;
  font-weight:bold;
}

#message{
  margin-top:15px;
  padding:12px;
  text-align:center;
  display:none;
  border-radius:10px;
}

.error{
  background:#fff0f0;
  color:#a51d1d;
}

.success{
  background:#e9fff3;
  color:#126b45;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#126b45;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

<h1>🧪 Arunodaya Science</h1>

<p class="subtitle">
Teacher / Admin Login
</p>

<form id="loginForm">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required
>

<button type="submit" id="loginBtn">
Login
</button>

</form>

<div id="message"></div>

<a class="back" href="index.html">
← Back to Home
</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ttuhcdgclnsxhoypfwhk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_u_U8gTism0c2pgGLlh-FIw_m4re6VSG";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const loginBtn =
document.getElementById("loginBtn");

form.addEventListener("submit", async function(event){

event.preventDefault();

loginBtn.disabled=true;
loginBtn.textContent="Logging in...";

message.style.display="none";

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

try{

const result =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(result.error){
throw result.error;
}

const user=result.data.user;

  const profileResult =
await supabaseClient
.from("profiles")
.select("id, role")
.eq("id", user.id);

if(profileResult.error){
throw profileResult.error;
}

if(!profileResult.data || profileResult.data.length === 0){
throw new Error(
"Login worked, but no profile exists for this account."
);
}

const role = profileResult.data[0].role;

if(role==="teacher"){

message.textContent=
"Teacher login successful. Opening dashboard...";

message.className="success";
message.style.display="block";

setTimeout(function(){
window.location.href="teacher.html";
},1000);

}

else if(role==="admin"){

message.textContent=
"Admin login successful. Opening dashboard...";

message.className="success";
message.style.display="block";

setTimeout(function(){
window.location.href="admin-dashboard.html";
},1000);

}

else{

await supabaseClient.auth.signOut();

throw new Error(
"Account is not authorized as Teacher or Admin."
);

}

}

catch(error){

message.textContent=
error.message || "Login failed.";

message.className="error";
message.style.display="block";

loginBtn.disabled=false;
loginBtn.textContent="Login";

}

});

</script>

</body>
</html>
